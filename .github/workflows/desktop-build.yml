name: Private Desktop Candidate

# Manual qualification only. No releases, updater feed writes or plaintext uploads.
on:
  workflow_dispatch:
    inputs:
      recipient_certificate_base64:
        description: Public X.509 encryption certificate; private key stays with the operator
        type: string
        required: true

permissions:
  contents: read

# Immutable release inputs. Keep the preflight and all platform bundles on
# exactly one reviewed source set; changing a sibling revision is one edit.
env:
  REZ_CORE_REF: 3d591dbf57183ac6fda1749f2cb8cd2d46c96814
  REZ_SDK_REF: a2becf80cb935e736fcc9799fc2a0ed5e10cb630
  REZ_NODE_REF: 002e0505f99261333f02d1ffc0ff317918ac852a
  REZ_UI_REF: d8375872621f05dc254e4861dff573b424e661a4

jobs:
  preflight:
    name: Security and recovery preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      REZ_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
      REZ_REDIS_TEST_URL: redis://127.0.0.1:6380
    steps:
      - name: Checkout rez-chat
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rez-chat

      - name: Checkout rez-core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-core
          path: rez-core
          ref: ${{ env.REZ_CORE_REF }}

      - name: Checkout rez-sdk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-sdk
          path: rez-sdk
          ref: ${{ env.REZ_SDK_REF }}

      - name: Checkout rez-node
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-node
          path: rez-node
          ref: ${{ env.REZ_NODE_REF }}

      - name: Checkout rez-ui
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-ui
          path: rez-ui
          ref: ${{ env.REZ_UI_REF }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: rez-chat/.node-version
          cache: npm
          cache-dependency-path: rez-chat/release/workspace-package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      - name: Install the locked root workspace
        shell: bash
        run: |
          set -euo pipefail
          cp rez-chat/release/workspace-package.json package.json
          cp rez-chat/release/workspace-package-lock.json package-lock.json
          npm ci --no-audit --no-fund

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --no-yanked --json > "$RUNNER_TEMP/cargo-audit.json"
          jq -e '(.vulnerabilities.count == 0) and (((.warnings.unsound // []) | length) == 0)' \
            "$RUNNER_TEMP/cargo-audit.json"
        working-directory: rez-chat/src-tauri

      - name: Test rez-core
        run: npm test
        working-directory: rez-core

      - name: Test rez-sdk
        run: npm test
        working-directory: rez-sdk

      - name: Test rez-node with durable backends
        run: npm test
        working-directory: rez-node

      - name: Test rez-ui
        run: npm test
        working-directory: rez-ui

      - name: Test rez-chat
        run: npm test
        working-directory: rez-chat

      - name: Test encrypted local mesh and restart recovery
        run: npm run test:e2e:local-mesh
        working-directory: rez-chat

      - name: Prove private backend recovery
        shell: bash
        run: |
          set -euo pipefail
          docker build -f rez-node/Dockerfile -t rez-desktop-private:check .
          REZ_RELEASE_IMAGE=rez-desktop-private:check node rez-node/scripts/test-support/prepare-release-proof.mjs > "$RUNNER_TEMP/proof-root"
          root=$(cat "$RUNNER_TEMP/proof-root")
          docker compose -f "$root/rez-node/deploy/docker-compose.yml" up -d --wait
          set -a
          source "$root/proof.env"
          set +a
          REZ_HOSTED_RECOVERY_ROOT="$root" node --test --test-timeout=360000 rez-node/test/e2e.hosted-compose.test.js
          docker compose -f "$root/rez-node/deploy/docker-compose.yml" down --volumes

      - name: Install desktop UI test prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64

      - name: Build web assets and run all enabled desktop integration gates
        shell: bash
        run: |
          set -euo pipefail
          npm -w rez-chat run build
          RUN_INTEGRATION=1 node --test --test-concurrency=1 --test-timeout=180000 \
            rez-chat/test/desktop.two-user-events.integration.test.js \
            rez-chat/test/desktop.two-user-mutations.integration.test.js
          node rez-chat/scripts/desktop-native-modules.mjs rebuild-electron
          RUN_INTEGRATION=1 xvfb-run -a node --test --test-timeout=180000 rez-chat/test/desktop.two-user-ui.integration.test.js
          node rez-chat/scripts/desktop-native-modules.mjs restore

  build:
    needs: preflight
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          # Windows remains deferred until signing credentials are provisioned.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout rez-chat
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rez-chat

      - name: Checkout rez-core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-core
          path: rez-core
          ref: ${{ env.REZ_CORE_REF }}

      - name: Checkout rez-sdk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-sdk
          path: rez-sdk
          ref: ${{ env.REZ_SDK_REF }}

      - name: Checkout rez-node
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-node
          path: rez-node
          ref: ${{ env.REZ_NODE_REF }}

      - name: Checkout rez-ui
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rezprotocol/rez-ui
          path: rez-ui
          ref: ${{ env.REZ_UI_REF }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: rez-chat/.node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rez-chat/src-tauri

      - name: Add Rust target for the pinned toolchain
        # dtolnay/rust-toolchain adds `targets` to `stable`, but
        # rez-chat/rust-toolchain.toml pins channel 1.96.0 — the toolchain the
        # build actually uses. Add the matrix target from rez-chat/ so the
        # toolchain-file override applies (otherwise cross-arch macOS legs fail
        # with "Target ... is not installed").
        run: rustup target add ${{ matrix.target }}
        working-directory: rez-chat

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsecret-1-dev xvfb

      - name: Install the locked root workspace
        shell: bash
        run: |
          set -euo pipefail
          cp rez-chat/release/workspace-package.json package.json
          cp rez-chat/release/workspace-package-lock.json package-lock.json
          npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run desktop:build:web
        working-directory: rez-chat

      - name: Fetch sidecar Node binary
        run: node scripts/fetch-sidecar-node.mjs ${{ matrix.target }}
        working-directory: rez-chat

      - name: Deep-sign bundled native modules (macOS)
        # Tauri signs the .app and the bundled `rez-chat-node` externalBin, but treats
        # node_modules as plain resources — so the better-sqlite3 native addon
        # ships unsigned and Apple's notary rejects the archive ("not signed
        # with a valid Developer ID certificate" / "no secure timestamp").
        # electron-builder deep-signed nested binaries automatically; replicate
        # that here: import the Developer ID cert into a throwaway keychain and
        # codesign every .node under better-sqlite3 with hardened runtime + a
        # secure timestamp BEFORE the bundler copies it into the app. The
        # bundler seals (does not re-sign) already-signed nested code, so these
        # signatures survive into the notarized bundle.
        if: runner.os == 'macOS'
        working-directory: rez-chat
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/rez-deepsign.keychain-db"
          KEYCHAIN_PW="rez-ci-deepsign"
          CERT="$RUNNER_TEMP/devid.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list so codesign can find the key.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT"
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "Signing $f"
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done < <(find ../node_modules/better-sqlite3 -name '*.node' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::No better-sqlite3 .node binary found to sign"; exit 1
          fi

      - name: Install the pinned desktop builder
        run: cargo install tauri-cli --locked --version 2.11.2

      - name: Test native launcher security
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml launcher_security_tests
        working-directory: rez-chat

      - name: Build private desktop candidate
        working-directory: rez-chat
        env:
          REZ_DESKTOP_TARGET: ${{ matrix.target }}
          REZ_DESKTOP_BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          if [ "$RUNNER_OS" = macOS ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          cargo tauri build --ci --target "$REZ_DESKTOP_TARGET" --bundles "$REZ_DESKTOP_BUNDLES"

      - name: Install and qualify the signed macOS disk image
        if: runner.os == 'macOS'
        working-directory: rez-chat
        env:
          REZ_DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dmg=$(find "src-tauri/target/$REZ_DESKTOP_TARGET/release/bundle/dmg" -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount="$RUNNER_TEMP/rez-candidate-mounted"
          installed="$RUNNER_TEMP/rez-candidate-installed/Rez Chat.app"
          mkdir -p "$mount" "$(dirname "$installed")"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          ditto "$mount/Rez Chat.app" "$installed"
          hdiutil detach "$mount"
          trap - EXIT
          codesign --verify --deep --strict --verbose=2 "$installed"
          spctl --assess --type execute --verbose=2 "$installed"
          xcrun stapler validate "$installed"
          node scripts/verify-packaged-desktop.mjs \
            --executable "$installed/Contents/MacOS/rez-chat-shell" \
            --data-dir "$RUNNER_TEMP/rez-installed-smoke-profile"

      - name: Upgrade a real rc.10 encrypted profile with the signed macOS app
        if: runner.os == 'macOS'
        working-directory: rez-chat
        env:
          REZ_DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          arch=aarch64
          checksum=a08283507a6ccc07ae98b887fc2f726759309446c14d20e2c1f5659d8ff6d14b
          if [ "$REZ_DESKTOP_TARGET" = x86_64-apple-darwin ]; then
            arch=x64
            checksum=212e8c14dfc5d1e24c7a8cdb6cdcd2e9d792b7d11f97b1b6cb4ab73dc08c2bb5
          fi
          old="$RUNNER_TEMP/rez-old-installer"
          mkdir -p "$old"
          curl --fail --location --output "$old/app.tar.gz" \
            "https://github.com/rezprotocol/rez-chat/releases/download/v0.6.0-rc.10/Rez.Chat_$arch.app.tar.gz"
          printf '%s  %s\n' "$checksum" "$old/app.tar.gz" | shasum -a 256 --check
          tar -xzf "$old/app.tar.gz" -C "$old"
          installed="$RUNNER_TEMP/rez-candidate-installed/Rez Chat.app"
          profile="$RUNNER_TEMP/rez-upgrade-profile"
          "$old/Rez Chat.app/Contents/MacOS/node" scripts/verify-desktop-upgrade.mjs seed \
            "$old/Rez Chat.app/Contents/Resources" "$profile"
          for boot in 1 2; do
            "$installed/Contents/MacOS/rez-chat-node" scripts/verify-desktop-upgrade.mjs check \
              "$installed/Contents/Resources" "$profile"
          done
          node scripts/verify-packaged-desktop.mjs \
            --executable "$installed/Contents/MacOS/rez-chat-shell" --data-dir "$profile"

      - name: Install and smoke Linux deb twice
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb"
          package=$(dpkg-deb --field "$deb" Package)
          test "$package" = "rez-chat"
          test "$(dpkg-deb --field "$deb" Architecture)" = "amd64"
          sudo dpkg --install "$deb"
          test "$(dpkg-query --show --showformat='${Status}' "$package")" = "install ok installed"
          mapfile -t app_candidates < <(
            dpkg-query --listfiles "$package" \
              | grep '^/usr/bin/' \
              | grep -v '/rez-chat-node$'
          )
          test "${#app_candidates[@]}" -eq 1
          test -x "${app_candidates[0]}"
          timeout --signal=TERM --kill-after=30s 6m xvfb-run -a node scripts/verify-packaged-desktop.mjs \
            --executable "${app_candidates[0]}" \
            --data-dir "$RUNNER_TEMP/rez-chat-deb-smoke-profile"
        working-directory: rez-chat

      - name: Smoke Linux AppImage twice
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          timeout --signal=TERM --kill-after=30s 6m xvfb-run -a node scripts/verify-packaged-desktop.mjs \
            --executable "$appimage" \
            --data-dir "$RUNNER_TEMP/rez-chat-smoke-profile"
        working-directory: rez-chat

      - name: Encrypt private candidate before upload
        id: encrypt
        shell: bash
        env:
          RECIPIENT_CERTIFICATE_BASE64: ${{ inputs.recipient_certificate_base64 }}
          REZ_DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -n "$RECIPIENT_CERTIFICATE_BASE64"
          export REZ_CANDIDATE_CERT="$RUNNER_TEMP/recipient.pem"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.REZ_CANDIDATE_CERT, Buffer.from(process.env.RECIPIENT_CERTIFICATE_BASE64, "base64"));'
          openssl_bin=openssl
          if [ "$RUNNER_OS" = macOS ]; then openssl_bin="$(brew --prefix openssl@3)/bin/openssl"; fi
          "$openssl_bin" x509 -in "$REZ_CANDIDATE_CERT" -noout -checkend 86400
          bundle="rez-chat/src-tauri/target/$REZ_DESKTOP_TARGET/release/bundle"
          tar -czf "$RUNNER_TEMP/candidate.tar.gz" -C "$bundle" .
          mkdir -p "$RUNNER_TEMP/encrypted-candidate"
          "$openssl_bin" cms -encrypt -binary -aes-256-gcm \
            -in "$RUNNER_TEMP/candidate.tar.gz" -outform DER \
            -out "$RUNNER_TEMP/encrypted-candidate/candidate.cms" \
            -recip "$REZ_CANDIDATE_CERT" \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
          sha256sum_cmd=sha256sum
          if [ "$RUNNER_OS" = macOS ]; then sha256sum_cmd="shasum -a 256"; fi
          $sha256sum_cmd "$RUNNER_TEMP/candidate.tar.gz" > "$RUNNER_TEMP/encrypted-candidate/plaintext.sha256"
          $sha256sum_cmd "$RUNNER_TEMP/encrypted-candidate/candidate.cms" > "$RUNNER_TEMP/encrypted-candidate/ciphertext.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/encrypted-candidate/chat-commit.txt"
          rm "$RUNNER_TEMP/candidate.tar.gz"

      - name: Upload encrypted private candidate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: private-desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/encrypted-candidate/
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/rez-deepsign.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/rez-deepsign.keychain-db"
          fi
