services:
  web-previews:
    image: ${REZ_NETWORK_IMAGE:-ghcr.io/rezprotocol/node:0.6.0-rc.11}
    container_name: rez-web-previews
    restart: unless-stopped
    entrypoint: ["node", "/app/rez-chat/scripts/serve-web-previews.mjs"]
    environment:
      REZ_WEB_ORIGIN: https://chat.rezprotocol.io
      REZ_WEB_TRUSTED_PROXIES: 172.30.0.4
    volumes:
      - ${REZ_WEB_PREVIEW_SOURCE:?required}/package.json:/app/rez-chat/package.json:ro
      - ${REZ_WEB_PREVIEW_SOURCE:?required}/src:/app/rez-chat/src:ro
      - ${REZ_WEB_PREVIEW_SOURCE:?required}/scripts/serve-web-previews.mjs:/app/rez-chat/scripts/serve-web-previews.mjs:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: node
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:8896/app/previews'); process.exit(r.status === 405 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
networks:
  edge:
    external: true
    name: rez-hosted_edge
